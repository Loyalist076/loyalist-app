name: CI/CD - Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump CSS/JS cache version
        run: npm run update-css-version

      - name: Syntax check server entrypoint
        run: node --check server.js

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    # Only deploy on direct pushes to main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
            cd ${{ secrets.EC2_APP_PATH }}
            echo "Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main
            echo "Installing dependencies..."
            npm ci --omit=dev
            echo "Bumping cache version..."
            npm run update-css-version
            echo "Restarting app with PM2..."
            pm2 restart loyalist-app --update-env || pm2 start server.js --name loyalist-app
            pm2 save
            echo "Deployment complete."
