<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f7fa;
    }

    h2, h3 {
      color: #333;
    }

    form {
      margin-bottom: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input[type="text"],
    input[type="file"],
    input[type="date"],
    button {
      display: block;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #D4B248;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #bfa032;
    }

    .pdf-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .pdf-card {
      background: white;
      padding: 20px;
      border-left: 5px solid #D4B248;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pdf-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .pdf-date {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .pdf-link {
      text-decoration: none;
      background-color: #D4B248;
      color: white;
      padding: 10px 15px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 10px;
      transition: background 0.3s;
    }

    .pdf-link:hover {
      background-color: #bfa032;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }

    #loading {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    /* Upload Dialog Styles */
    .upload-dialog-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .upload-dialog-overlay.active {
      display: flex;
    }

    .upload-dialog {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .upload-dialog h3 {
      margin: 0 0 20px 0;
      color: #333;
    }

    .upload-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #D4B248;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .upload-file-name {
      background: #f5f7fa;
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 14px;
      color: #555;
      word-break: break-all;
      margin-top: 15px;
      border-left: 4px solid #D4B248;
    }

    .upload-file-name span {
      font-weight: bold;
      color: #333;
    }

    .warning-message {
      background-color: #fff3cd;
      border: 2px solid #ffc107;
      border-left: 5px solid #ff9800;
      color: #856404;
      padding: 15px;
      margin-bottom: 30px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    .warning-message strong {
      color: #d97706;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h2>Upload a New PDF</h2>
  <form id="uploadForm">
    <input type="date" name="date" required />
    <input type="text" name="title" placeholder="PDF Title" required />
    <input type="file" name="pdf" accept="application/pdf" required />
    <button type="submit">Upload</button>
    <div id="loading"></div>
  </form>

  <div class="warning-message">
    <strong>⚠️ Important Notice:</strong> Only PDFs up to 2MB are approved. Larger files can cause performance issues and may fail to upload. Please ensure your PDF file size is within the limit before uploading.
  </div>

  <h3>Uploaded PDFs</h3>
  <div class="pdf-list" id="pdfList"></div>

  <!-- Upload Dialog -->
  <div class="upload-dialog-overlay" id="uploadDialog">
    <div class="upload-dialog">
      <h3>Uploading PDF</h3>
      <div class="upload-spinner"></div>
      <p>Please wait while your file is being uploaded...</p>
      <div class="upload-file-name">
        <span id="uploadFileName"></span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const pdfList = document.getElementById('pdfList');
    const loading = document.getElementById('loading');
    const token = localStorage.getItem('token');
    const uploadDialog = document.getElementById('uploadDialog');
    const uploadFileName = document.getElementById('uploadFileName');

    function showUploadDialog(fileName) {
      uploadFileName.textContent = fileName;
      uploadDialog.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function hideUploadDialog() {
      uploadDialog.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    if (!token) {
      alert('❌ Authentication required. Please log in again.');
      window.location.href = '../login.html';
    }

    const MONTH_NAMES = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];

    const handleAuthError = (status) => {
      if (status === 401) {
        alert('❌ Authentication failed. Please log in again.');
        localStorage.removeItem('token');
        window.location.href = '../login.html';
        return true;
      }

      if (status === 403) {
        alert('❌ Access denied. Admin privileges required.');
        return true;
      }

      return false;
    };

    const parsePdfDate = (value, fallback) => {
      if (value && /^\d{4}-\d{2}-\d{2}$/.test(value.trim())) {
        const [yearStr, monthStr, dayStr] = value.trim().split('-');
        const year = parseInt(yearStr, 10);
        const monthIndex = parseInt(monthStr, 10) - 1;
        const day = parseInt(dayStr, 10);

        if (!Number.isNaN(year) && monthIndex >= 0 && !Number.isNaN(day)) {
          return {
            year,
            monthIndex,
            day,
            timestamp: Date.UTC(year, monthIndex, day),
            source: 'explicit'
          };
        }
      }

      const fallbackSource = value || fallback;
      if (fallbackSource) {
        const dateObj = new Date(fallbackSource);
        if (!isNaN(dateObj)) {
          return {
            year: dateObj.getFullYear(),
            monthIndex: dateObj.getMonth(),
            day: dateObj.getDate(),
            dateObj,
            timestamp: dateObj.getTime(),
            source: fallbackSource === fallback ? 'fallback' : 'parsed'
          };
        }
      }

      return null;
    };

    const formatPdfDate = (value, fallback) => {
      const parsed = parsePdfDate(value, fallback);
      if (!parsed) return 'Date not available';

      if (parsed.source === 'explicit') {
        const monthName = MONTH_NAMES[parsed.monthIndex] || '';
        const day = parsed.day.toString().padStart(2, '0');
        return `${monthName} ${day}, ${parsed.year}`;
      }

      return parsed.dateObj.toLocaleDateString('en-CA', {
        timeZone: 'America/Toronto',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const fileInput = form.querySelector('input[type="file"]');
      const fileName = fileInput.files[0]?.name || 'Unknown file';

      showUploadDialog(fileName);

      try {
        const response = await fetch('/api/pdf/upload', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          hideUploadDialog();
          alert(`✅ PDF "${result.pdf.title}" uploaded successfully!`);
          form.reset();
          fetchPDFs();
        } else {
          hideUploadDialog();
          if (!handleAuthError(response.status)) {
            alert('❌ Upload failed: ' + (result.error || 'Something went wrong.'));
          }
        }
      } catch (err) {
        hideUploadDialog();
        alert('❌ Network error: ' + err.message);
        console.error(err);
      }
    });

    async function fetchPDFs() {
      loading.textContent = '📥 Loading PDFs...';
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Authentication required. Please log in.');
        window.location.href = '/admin/login.html';
        return;
      }

      try {
        const res = await fetch('/api/pdf', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const pdfs = await res.json();
        pdfList.innerHTML = '';
        pdfCache = {};

        pdfs.forEach(pdf => {
          pdfCache[pdf._id] = pdf;
          // Format date in Canadian Eastern Time, treating stored value as a date-only string
          const dateFormatted = formatPdfDate(pdf.date, pdf.createdAt);

          const card = document.createElement('div');
          card.classList.add('pdf-card');

          // Use backend view/download endpoints to ensure consistent access
          const timestamp = Date.now();
          const pdfViewUrl = `/api/pdf/view/${pdf._id}?t=${timestamp}`;
          const pdfDownloadUrl = `/api/pdf/download/${pdf._id}?t=${timestamp}`;

          card.innerHTML = `
            <div class="pdf-title">📄 ${pdf.title}</div>
            <div class="pdf-date">📅 ${dateFormatted}</div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <a class="pdf-link" href="${pdfViewUrl}" target="_blank" rel="noopener noreferrer">View</a>
              <a class="pdf-link" href="${pdfDownloadUrl}" rel="noopener noreferrer">Download</a>
            </div>
            <button class="pdf-link" style="cursor:pointer;" onclick="replacePDF('${pdf._id}')">🔁 Replace</button>
            <button class="delete-btn" onclick="deletePDF('${pdf._id}')">🗑️ Delete</button>
          `;
          pdfList.appendChild(card);
        });
      } catch (err) {
        pdfList.innerHTML = '<p>❌ Failed to load PDFs.</p>';
        console.error(err);
      } finally {
        loading.textContent = '';
      }
    }

    let pdfCache = {};

    // Replace file and/or title on the SAME record — emailed links keep working, no email is sent.
    async function replacePDF(id) {
      const current = pdfCache[id];
      if (!current) return;

      const newTitle = prompt('Title (edit it, or press OK to keep as is):', current.title);
      if (newTitle === null) return; // cancelled

      const replaceFile = confirm('Do you also want to replace the PDF file?\n\nOK = choose a new file\nCancel = keep the current file');

      const submit = async (file) => {
        const formData = new FormData();
        formData.append('title', newTitle);
        if (file) formData.append('pdf', file);

        showUploadDialog(file ? file.name : newTitle);
        try {
          const res = await fetch(`/api/pdf/replace/${id}`, {
            method: 'PUT',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const result = await res.json();
          hideUploadDialog();
          if (res.ok) {
            alert('✅ Press release updated. All existing links — including ones already emailed to subscribers — still work. No new email was sent.');
            fetchPDFs();
          } else if (!handleAuthError(res.status)) {
            alert('❌ Update failed: ' + (result.error || 'Something went wrong.'));
          }
        } catch (err) {
          hideUploadDialog();
          alert('❌ Network error: ' + err.message);
        }
      };

      if (replaceFile) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/pdf';
        input.onchange = () => input.files[0] && submit(input.files[0]);
        input.click();
      } else {
        submit(null);
      }
    }

    async function deletePDF(id) {
      if (!confirm('⚠️ WARNING: If this press release was already emailed to subscribers, deleting it will permanently BREAK the "View Press Release" link in their inboxes.\n\nTo fix a wrong file or title, use "Replace" instead — it keeps all links working.\n\nAre you sure you want to delete this PDF?')) return;

      try {
        const res = await fetch(`/api/pdf/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          alert('✅ PDF deleted successfully.');
          fetchPDFs();
        } else {
          if (!handleAuthError(res.status)) {
            alert('❌ Failed to delete PDF.');
          }
        }
      } catch (err) {
        alert('❌ Error deleting PDF.');
        console.error(err);
      }
    }

    fetchPDFs();
  </script>
</body>
</html>
