<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      background-color: #f5f7fa;
    }

    h2, h3 {
      color: #333;
    }

    form {
      margin-bottom: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input[type="text"],
    input[type="file"],
    input[type="date"],
    button {
      display: block;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 20px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background-color: #D4B248;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #bfa032;
    }

    .pdf-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .pdf-card {
      background: white;
      padding: 20px;
      border-left: 5px solid #D4B248;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pdf-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .pdf-date {
      font-size: 14px;
      color: #666;
      margin-bottom: 12px;
    }

    .pdf-link {
      text-decoration: none;
      background-color: #D4B248;
      color: white;
      padding: 10px 15px;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 10px;
      transition: background 0.3s;
    }

    .pdf-link:hover {
      background-color: #bfa032;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background-color: #c0392b;
    }

    #loading {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .warning-message {
      background-color: #fff3cd;
      border: 2px solid #ffc107;
      border-left: 5px solid #ff9800;
      color: #856404;
      padding: 15px;
      margin-bottom: 30px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    .warning-message strong {
      color: #d97706;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h2>Upload a New PDF</h2>
  <form id="uploadForm">
    <input type="date" name="date" required />
    <input type="text" name="title" placeholder="PDF Title" required />
    <input type="file" name="pdf" accept="application/pdf" required />
    <button type="submit">Upload</button>
    <div id="loading"></div>
  </form>

  <div class="warning-message">
    <strong>⚠️ Important Notice:</strong> Only PDFs up to 2MB are approved. Larger files can cause performance issues and may fail to upload. Please ensure your PDF file size is within the limit before uploading.
  </div>

  <h3>Uploaded PDFs</h3>
  <div class="pdf-list" id="pdfList"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const pdfList = document.getElementById('pdfList');
    const loading = document.getElementById('loading');
    const token = localStorage.getItem('token');

    if (!token) {
      alert('❌ Authentication required. Please log in again.');
      window.location.href = '../login.html';
    }

    const handleAuthError = (status) => {
      if (status === 401) {
        alert('❌ Authentication failed. Please log in again.');
        localStorage.removeItem('token');
        window.location.href = '../login.html';
        return true;
      }

      if (status === 403) {
        alert('❌ Access denied. Admin privileges required.');
        return true;
      }

      return false;
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      loading.textContent = '📤 Uploading PDF...';

      try {
        const response = await fetch('/api/pdf/upload', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const result = await response.json();

        if (response.ok) {
          alert(`✅ PDF "${result.pdf.title}" uploaded successfully!`);
          form.reset();
          fetchPDFs();
        } else {
          if (!handleAuthError(response.status)) {
            alert('❌ Upload failed: ' + (result.error || 'Something went wrong.'));
          }
        }
      } catch (err) {
        alert('❌ Network error: ' + err.message);
        console.error(err);
      } finally {
        loading.textContent = '';
      }
    });

    async function fetchPDFs() {
      loading.textContent = '📥 Loading PDFs...';
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Authentication required. Please log in.');
        window.location.href = '/admin/login.html';
        return;
      }

      try {
        const res = await fetch('/api/pdf', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const pdfs = await res.json();
        pdfList.innerHTML = '';

        pdfs.forEach(pdf => {
          const dateFormatted = pdf.date
            ? new Date(pdf.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
            : 'Date not available';

          const card = document.createElement('div');
          card.classList.add('pdf-card');
          card.innerHTML = `
            <div class="pdf-title">📄 ${pdf.title}</div>
            <div class="pdf-date">📅 ${dateFormatted}</div>
            <a class="pdf-link" href="${pdf.url}" target="_blank" rel="noopener noreferrer">View / Download</a>
            <button class="delete-btn" onclick="deletePDF('${pdf._id}')">🗑️ Delete</button>
          `;
          pdfList.appendChild(card);
        });
      } catch (err) {
        pdfList.innerHTML = '<p>❌ Failed to load PDFs.</p>';
        console.error(err);
      } finally {
        loading.textContent = '';
      }
    }

    async function deletePDF(id) {
      if (!confirm('Are you sure you want to delete this PDF?')) return;

      try {
        const res = await fetch(`/api/pdf/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          alert('✅ PDF deleted successfully.');
          fetchPDFs();
        } else {
          if (!handleAuthError(res.status)) {
            alert('❌ Failed to delete PDF.');
          }
        }
      } catch (err) {
        alert('❌ Error deleting PDF.');
        console.error(err);
      }
    }

    fetchPDFs();
  </script>
</body>
</html>
