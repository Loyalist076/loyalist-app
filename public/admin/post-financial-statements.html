<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post Financial Statement</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #333;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      height: 100px;
    }

    button {
      padding: 10px 16px;
      background-color: #007bff;
      color: white;
      font-size: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      display: none;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    .statements {
      margin-top: 40px;
    }

    .statement-item {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .statement-details {
      flex: 1 1 75%;
    }

    .statement-actions {
      text-align: right;
    }

    .statement-actions a,
    .statement-actions button {
      margin-left: 10px;
    }

    a.view-link {
      color: #007bff;
      text-decoration: none;
    }

    a.view-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Post Financial Statement</h2>

    <form id="financialForm" enctype="multipart/form-data">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required placeholder="Enter statement title">

      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Short description..."></textarea>

      <label for="date">Statement Date</label>
      <input type="date" id="date" name="date" required>

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="annual">Annual Report</option>
        <option value="quarterly">Quarterly</option>
        <option value="mda">MD&A</option>
      </select>

      <label for="pdfFile">Upload PDF File</label>
      <input type="file" id="pdfFile" name="pdfFile" accept="application/pdf" required>

      <button type="submit">Post Statement</button>
      <div id="successMessage" class="message success"></div>
      <div id="errorMessage" class="message error"></div>
    </form>

    <div class="statements">
      <h3>All Financial Statements</h3>
      <div id="statementList"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('financialForm');
    const successMsg = document.getElementById('successMessage');
    const errorMsg = document.getElementById('errorMessage');
    const statementList = document.getElementById('statementList');

    // Fetch all statements
    async function fetchStatements() {
      statementList.innerHTML = '';
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Authentication required. Please log in.');
        window.location.href = '/admin/login.html';
        return;
      }

      try {
        const res = await fetch('/api/financials', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        data.forEach(statement => {
          const item = document.createElement('div');
          item.className = 'statement-item';

          item.innerHTML = `
            <div class="statement-details">
              <strong>${statement.title}</strong> (${statement.category.toUpperCase()})<br>
              <small>${new Date(statement.date).toLocaleDateString()}</small><br>
              <p>${statement.description || ''}</p>
            </div>
            <div class="statement-actions">
              <a href="${statement.fileUrl}" class="view-link" target="_blank">View PDF</a>
              <button onclick="deleteStatement('${statement._id}')">Delete</button>
            </div>
          `;

          statementList.appendChild(item);
        });

      } catch (err) {
        statementList.innerHTML = `<p style="color: red;">Failed to load statements.</p>`;
      }
    }

    // Submit form
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const token = localStorage.getItem('token');
      if (!token) {
        alert('Authentication required. Please log in.');
        window.location.href = '/admin/login.html';
        return;
      }

      successMsg.style.display = 'none';
      errorMsg.style.display = 'none';

      const formData = new FormData(form);

      try {
        const res = await fetch('/api/financials/upload', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const result = await res.json();

        if (res.ok) {
          successMsg.textContent = result.message || 'Statement posted successfully!';
          successMsg.style.display = 'block';
          form.reset();
          fetchStatements(); // Refresh list
        } else {
          throw new Error(result.error || 'Failed to post financial statement.');
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
      }
    });

    // Delete function
    async function deleteStatement(id) {
      if (confirm('Are you sure you want to delete this statement?')) {
        const token = localStorage.getItem('token');
        if (!token) {
          alert('Authentication required. Please log in.');
          window.location.href = '/admin/login.html';
          return;
        }

        try {
          const res = await fetch(`/api/financials/${id}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${token}`
            }
          });

          if (res.ok) {
            fetchStatements(); // Refresh list
          } else {
            const err = await res.json();
            alert(err.error || 'Failed to delete.');
          }
        } catch (err) {
          alert('Failed to delete statement.');
        }
      }
    }

    // Initial load
    fetchStatements();
  </script>
</body>
</html>
