<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subscribed Users</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-common.css">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 40px;
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }
    select {
      margin-bottom: 20px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-main">
      <div class="admin-header">
        <h1 class="admin-header__title">📧 Subscribed Users</h1>
      </div>

  <div class="admin-card">
  <label for="sourceFilter">Filter by Source:</label>
  <select id="sourceFilter" onchange="fetchSubscribers()">
    <option value="all">All</option>
    <option value="popup">Popup</option>
    <option value="homepage">Homepage</option>
    <option value="about">About</option>
  </select>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Source</th>
        <th>Subscribed At</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="subscribersTableBody"></tbody>
  </table>

  <script>
    async function fetchSubscribers() {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('Authentication required. Please log in.');
        window.location.href = '/admin/login.html';
        return;
      }

      try {
        const res = await fetch('/api/subscribe', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const data = await res.json();

        const filter = document.getElementById('sourceFilter').value;
        const tbody = document.getElementById('subscribersTableBody');
        tbody.innerHTML = '';

        const filtered = filter === 'all' ? data : data.filter(sub => sub.source === filter);

        filtered.forEach(sub => {
          const row = document.createElement('tr');
          // Format date in Canadian Eastern Time
          const subDate = new Date(sub.createdAt);
          const formattedDate = subDate.toLocaleString('en-CA', {
            timeZone: 'America/Toronto',
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
          row.innerHTML = `
            <td>${sub.email}</td>
            <td>${sub.source || 'popup'}</td>
            <td>${formattedDate}</td>
            <td><button onclick="deleteSubscriber('${sub._id}')">Delete</button></td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Error fetching subscribers:', err);
      }
    }

    async function deleteSubscriber(id) {
      if (!confirm('Are you sure you want to delete this subscriber?')) return;

      const token = localStorage.getItem('token');
      if (!token) {
        alert('Authentication required. Please log in.');
        window.location.href = '/admin/login.html';
        return;
      }

      try {
        const res = await fetch(`/api/subscribe/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        const result = await res.json();

        if (res.ok) {
          alert(result.message);
          fetchSubscribers();
        } else {
          alert(result.message || 'Failed to delete');
        }
      } catch (err) {
        console.error('Error deleting subscriber:', err);
      }
    }

    fetchSubscribers();
  </script>
  </div>
  <script src="admin-sidebar.js"></script>
    </div>
  </div>
</body>
</html>
